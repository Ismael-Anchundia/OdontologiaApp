# Blueprint de Render: API Go (Docker) + PostgreSQL + frontend estático conectado a la API.
# Al crear el Blueprint, Render pide DENTAL_ADMIN_EMAIL y DENTAL_ADMIN_PASSWORD (mínimo 12 caracteres).
databases:
  - name: dentalia-db
    databaseName: dentalia
    user: dentalia
    plan: free

services:
  - type: web
    name: dentalia-api
    runtime: docker
    rootDir: backend/multicatalogo-backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: dentalia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DENTAL_ADMIN_EMAIL
        sync: false
      - key: DENTAL_ADMIN_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: dentalia-web
          property: host
      # Opcional: gateway de WhatsApp/SMS/email para confirmaciones y recordatorios.
      - key: NOTIFICATIONS_WEBHOOK_URL
        sync: false
      - key: NOTIFICATIONS_WEBHOOK_SECRET
        sync: false

  - type: web
    name: dentalia-web
    runtime: static
    rootDir: frontend/Practica03_a_05_de_la_Unidad
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.20.0
      - key: VITE_API_URL
        fromService:
          type: web
          name: dentalia-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
