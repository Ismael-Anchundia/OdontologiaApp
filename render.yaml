services:
  - type: web
    name: dentalia-demo
    runtime: static
    rootDir: frontend/Practica03_a_05_de_la_Unidad
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_DEMO_MODE
        value: "true"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
